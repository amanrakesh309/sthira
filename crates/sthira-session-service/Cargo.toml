[package]
name = "sthira-session-service"
version = "0.1.0"
edition = "2021"
description = "Independent session, device enrollment, and per-device revocation service for Sthira"

[lib]
name = "sthira_session_service"
path = "src/lib.rs"

[[bin]]
name = "sthira-session-service"
path = "src/main.rs"

[dependencies]
sthira-backup-format = { path = "../sthira-backup-format" }
async-trait = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.2"
markdown = "1.0.0"
reqwest = { workspace = true }
ring = "0.17"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.30"
url = "2"
uuid = { workspace = true }
yrs = "0.28"

[dev-dependencies]
tempfile = { workspace = true }
