[package]
name = "sthira-desktop"
version = "0.1.0"
edition = "2021"
description = "Sthira Desktop Tauri v2 application"

[lib]
name = "sthira_desktop"
path = "src/lib.rs"

[[bin]]
name = "sthira-desktop"
path = "src/main.rs"

[dependencies]
sthira-core = { workspace = true }
sthira-cli = { path = "../sthira-cli" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
tauri = { version = "2.2", features = [] }
schemars = { workspace = true }
tokio-tungstenite = "0.30"
url = "2"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dev-dependencies]
sthira-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
