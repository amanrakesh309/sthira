[workspace]
resolver = "2"
members = [
    "crates/sthira-core",
    "crates/sthira-testkit",
    "crates/sthira-cli",
    "crates/sthira-desktop",
    "xtask",
]

[workspace.dependencies]
sthira-core = { path = "crates/sthira-core" }
sthira-testkit = { path = "crates/sthira-testkit" }
rusqlite = { version = "0.41", features = ["bundled"] }
sqlite-vec = "0.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
r2d2 = "0.8"
proptest = "1.5"
regex = "1.11"
schemars = "0.8"
unicode-normalization = "0.1"
walkdir = "2.5"
tempfile = "3.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

